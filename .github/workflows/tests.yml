name: Tests

on: [push, pull_request]

env:
  # rabbitevents/foundation and rabbitevents/listener ^10.0 are not on Packagist yet:
  # take them from this branch of rabbitevents/rabbitevents. Drop the two steps once 10.0 is released.
  RABBITEVENTS_REF: '10.x'

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4']
    name: PHPUnit on PHP ${{ matrix.php-versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout RabbitEvents ${{ env.RABBITEVENTS_REF }}
        uses: actions/checkout@v6
        with:
          repository: rabbitevents/rabbitevents
          ref: ${{ env.RABBITEVENTS_REF }}
          path: .rabbitevents

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, sockets
          tools: composer:v2
          coverage: none

      - name: Use RabbitEvents ${{ env.RABBITEVENTS_REF }}
        run: |
          composer config repositories.rabbitevents-foundation '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Foundation", "options": {"versions": {"rabbitevents/foundation": "10.0.x-dev"}}}'
          composer config repositories.rabbitevents-listener '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Listener", "options": {"versions": {"rabbitevents/listener": "10.0.x-dev"}}}'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v6

      - name: Checkout RabbitEvents ${{ env.RABBITEVENTS_REF }}
        uses: actions/checkout@v6
        with:
          repository: rabbitevents/rabbitevents
          ref: ${{ env.RABBITEVENTS_REF }}
          path: .rabbitevents

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sockets
          tools: composer:v2
          coverage: none

      - name: Use RabbitEvents ${{ env.RABBITEVENTS_REF }}
        run: |
          composer config repositories.rabbitevents-foundation '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Foundation", "options": {"versions": {"rabbitevents/foundation": "10.0.x-dev"}}}'
          composer config repositories.rabbitevents-listener '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Listener", "options": {"versions": {"rabbitevents/listener": "10.0.x-dev"}}}'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress
